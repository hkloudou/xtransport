version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/packets/mqtt"
      - "/transports/tcp"
      - "/transports/ws"
      - "/transports/quic"
      - "/interop"
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/interop/js"
    schedule:
      interval: weekly
